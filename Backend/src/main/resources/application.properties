spring.application.name=pukar-backend

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pukar}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:cdac}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== File uploads =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
pukar.storage.dir=${PUKAR_STORAGE_DIR:./storage}

# ===== JWT =====
# Base64-encoded 256-bit secret. Override in production via env var.
pukar.jwt.secret=${JWT_SECRET:cGtyU3VwZXJTZWNyZXRLZXlGb3JQdWthckNpdmljUGxhdGZvcm0yMDI1MTIzNDU2Nzg5MA==}
pukar.jwt.access-token-minutes=480
pukar.jwt.refresh-token-days=7

# ===== Identity hashing salt (server-side pepper for reporter hashing) =====
pukar.security.reporter-salt=${REPORTER_SALT:pukar-civic-salt-2025}

# ===== Public visibility threshold (anti-deanonymization) =====
pukar.public.min-cluster-size=1

# ===== Mumbai-only geofence (bounding box) for complaint submission =====
pukar.geofence.min-lat=18.89
pukar.geofence.max-lat=19.27
pukar.geofence.min-lng=72.77
pukar.geofence.max-lng=72.98

# ===== Seed demo data on startup =====
pukar.seed.enabled=true

logging.level.org.springframework.security=INFO

# ===== Citizen OTP verification (reporter-only feedback) =====
pukar.jwt.citizen-token-minutes=${CITIZEN_TOKEN_MINUTES:30}
pukar.otp.length=${OTP_LENGTH:6}
pukar.otp.ttl-seconds=${OTP_TTL_SECONDS:300}
pukar.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
# dev-mode returns the OTP in the API response & logs it (no real SMS gateway wired)
pukar.otp.dev-mode=${OTP_DEV_MODE:true}
